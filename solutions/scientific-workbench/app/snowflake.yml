definition_version: "2"

entities:
  SCIENTIFIC_WORKBENCH_APP:
    type: snowflake-app
    identifier:
      name: SCIENTIFIC_WORKBENCH_APP
      database: SNOWFLAKE_APPS
      schema: PUBLIC
    artifacts:
      - src: ./*
        dest: ./
        ignore:
          - node_modules
          - .env*
          - __pycache__
          - "*.pyc"
          - .next
          - .git
          - snowflake.log
          - output
          - __tests__
          - "*.tsbuildinfo"
    query_warehouse: SNOWFLAKE_APPS_QUERY_WH
    code_workspace: SNOWFLAKE_APPS.PUBLIC.SNOWFLAKE_APPS
